<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense and Budget Visualizer</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/app.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Expense and Budget Visualizer</h1>
            <button id="theme-toggle" aria-label="Toggle dark/light mode">Toggle Theme</button>
        </header>

        <main>
            <!-- Error Message Banner -->
            <div id="error-message" class="error-banner" role="alert" aria-live="polite"></div>

            <!-- Alert Banners for Spending Limits -->
            <div id="alert-banner-container" role="alert" aria-live="polite"></div>

            <!-- Balance Display -->
            <section class="balance-section">
                <h2>Total Balance</h2>
                <div id="balance-display" class="balance-amount">$0.00</div>
            </section>

            <!-- Transaction Input Form -->
            <section class="input-section">
                <h2>Add Transaction</h2>
                <form id="input-form">
                    <div class="form-group">
                        <label for="item-name">Item Name:</label>
                        <input type="text" id="item-name" name="item-name" maxlength="100" required>
                        <span class="error-message" data-field="item-name"></span>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount:</label>
                        <input type="number" id="amount" name="amount" step="0.01" min="0.01" max="999999999.99" required>
                        <span class="error-message" data-field="amount"></span>
                    </div>

                    <div class="form-group">
                        <label for="category">Category:</label>
                        <select id="category" name="category" required>
                            <option value="">-- Select Category --</option>
                        </select>
                        <span class="error-message" data-field="category"></span>
                    </div>

                    <button type="submit">Add Transaction</button>
                </form>
            </section>

            <!-- Custom Category Management -->
            <section class="category-section">
                <h2>Add Custom Category</h2>
                <div class="category-input-group">
                    <input type="text" id="add-category-input" placeholder="Enter category name" maxlength="50">
                    <button id="add-category-btn">Add Category</button>
                </div>
                <span class="error-message" data-field="add-category"></span>
            </section>

            <!-- Spending Limits -->
            <section class="limits-section">
                <h2>Spending Limits</h2>
                <div id="spending-limits-container"></div>
            </section>

            <!-- Filters and Sorting -->
            <section class="controls-section">
                <div class="control-group">
                    <label for="month-filter">Filter by Month:</label>
                    <input type="month" id="month-filter" name="month-filter">
                </div>

                <div class="control-group">
                    <label for="sort-control">Sort by:</label>
                    <select id="sort-control" name="sort-control">
                        <option value="">Default (Newest First)</option>
                        <option value="amount_asc">Amount (Low to High)</option>
                        <option value="amount_desc">Amount (High to Low)</option>
                        <option value="category_asc">Category (A-Z)</option>
                        <option value="category_desc">Category (Z-A)</option>
                    </select>
                </div>
            </section>

            <!-- Transaction List -->
            <section class="list-section">
                <h2>Transactions</h2>
                <ul id="transaction-list" class="transaction-list"></ul>
            </section>

            <!-- Spending Chart -->
            <section class="chart-section">
                <h2>Spending by Category</h2>
                <div class="chart-container">
                    <canvas id="chart-canvas"></canvas>
                    <div class="chart-empty-state" style="display: none;">
                        <p>No spending data to visualize</p>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Expense and Budget Visualizer</p>
        </footer>
    </div>
</body>
</html>
